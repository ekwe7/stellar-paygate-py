[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "stellar-paygate"
version = "0.1.0"
description = "Python HTTP 402 Pay-Per-Request Payment Gate, Agent Spend-Policy Client & Deterministic Offline Fault-Injection Harness for Stellar / Soroban SEP-41 Tokens"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ekwe7" }
]
keywords = ["stellar", "soroban", "http-402", "paygate", "sep-41", "fastapi", "httpx", "x402"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "stellar-sdk>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
stellar-paygate-sim = "stellar_paygate.fault_harness:main"
stellar-paygate = "stellar_paygate.cli:main"

[tool.poetry]
name = "stellar-paygate"
version = "0.1.0"
description = "Python HTTP 402 Pay-Per-Request Payment Gate, Agent Spend-Policy Client & Deterministic Offline Fault-Injection Harness for Stellar / Soroban SEP-41 Tokens"
authors = ["ekwe7"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "stellar_paygate", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11"
pydantic = ">=2.0"
httpx = ">=0.27"
fastapi = ">=0.110"
stellar-sdk = ">=9.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
ruff = ">=0.4.0"
mypy = ">=1.10.0"

[tool.poetry.scripts]
stellar-paygate-sim = "stellar_paygate.fault_harness:main"
stellar-paygate = "stellar_paygate.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --cov=stellar_paygate --cov-fail-under=80"
